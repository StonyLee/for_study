<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d50">
<title>찍고 듣는 공부 메모</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1 id="title">📖 찍고 듣는 공부 메모</h1>
  <button class="icon" data-act="settings" aria-label="설정">⚙️</button>
</header>

<main id="view"></main>

<div id="busy" class="busy" hidden><div class="spin"></div><p id="busyText">처리 중…</p></div>

<footer id="player" class="player" hidden>
  <div class="now"><b id="nowTitle"></b><span id="nowSub"></span></div>
  <div class="ctrl">
    <button data-act="prev" aria-label="이전 문제">⏮</button>
    <button data-act="toggle" id="btnToggle" class="big" aria-label="재생/일시정지">▶</button>
    <button data-act="next" aria-label="다음 문제">⏭</button>
    <button data-act="stop" aria-label="정지">⏹</button>
  </div>
  <label class="speed">속도 <input id="speed" type="range" min="0.6" max="1.8" step="0.05"> <output id="speedOut"></output></label>
</footer>

<audio id="audio" playsinline></audio>

<dialog id="settingsDlg">
  <form method="dialog" id="settingsForm">
    <h2>설정</h2>
    <label>OpenAI API 키 <small>(사진 인식·자연스러운 목소리용. 이 기기에만 저장)</small>
      <input id="setKey" type="password" placeholder="sk-..." autocomplete="off"></label>
    <label>목소리
      <select id="setVoice">
        <option>coral</option><option>nova</option><option>shimmer</option><option>sage</option>
        <option>alloy</option><option>ash</option><option>ballad</option><option>echo</option>
        <option>fable</option><option>onyx</option><option>verse</option>
      </select></label>
    <label class="row"><input id="setAnswer" type="checkbox"> 문제 뒤에 정답도 읽기</label>
    <label>문제 읽고 정답 전 쉬는 시간(초)
      <input id="setPause" type="number" min="0" max="30" step="1"></label>
    <label class="row"><input id="setLoop" type="checkbox"> 챕터 끝나면 처음부터 반복</label>
    <p class="hint">API 키가 없으면 무료 인식(정확도 낮음)과 브라우저 기본 음성을 사용하며, 화면이 꺼지면 소리가 끊길 수 있습니다.</p>
    <div class="btns"><button value="cancel">취소</button><button value="ok" class="primary">저장</button></div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
